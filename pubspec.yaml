name: rasslive_legendary
description: "RASSLIVE with Zego Gift System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  zego_uikit_prebuilt_live_streaming: 3.12.5
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.1

dependency_overrides:
  device_info_plus: 10.1.2
  device_info_plus_platform_interface: 7.0.0
  package_info_plus: 8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/gifts/
    - assets/animations/
    - assets/sounds/
    - assets/images/
