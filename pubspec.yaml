name: rasslive_legendary
description: "RASSLIVE with Zego Gift System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  zego_uikit_prebuilt_live_streaming: 3.14.4
  zego_uikit: 3.14.0
  zego_express_engine: 3.14.6

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.1
  lottie: ^3.1.2
  rive: ^0.12.4
  audioplayers: ^6.0.0
  vibration: ^3.1.3
  confetti: ^0.7.0

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/gifts/
    - assets/animations/
    - assets/sounds/
    - assets/images/
