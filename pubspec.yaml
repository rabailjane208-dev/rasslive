name: rasslive_legendary
description: "RASSLIVE with Zego Gift System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # ZEGO GIFT SYSTEM
  zego_uikit_prebuilt_live_streaming: 3.14.4
  zego_uikit: 3.14.0
  zego_express_engine: 3.14.6

  device_info_plus: 11.2.0
  confetti: ^0.8.0

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.1
  lottie: ^3.1.2
  rive: ^0.12.4
  audioplayers: ^6.0.0
  vibration: ^3.1.3

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/gifts/
    - assets/animations/
    - assets/sounds/
    - assets/images/
