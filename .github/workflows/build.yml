name: RASS LIVE ZEGO BUILD
on:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - name: Fix Android v1 embedding
        run: |
          flutter clean
          rm -rf android
          flutter create --platforms=android --org com.rasslive.app . --overwrite
          ls -R android/app | head -n 100
      - name: Fix SDK and NDK versions
        run: |
          FILE=""
          if [ -f "android/app/build.gradle" ]; then FILE="android/app/build.gradle"; fi
          if [ -f "android/app/build.gradle.kts" ]; then FILE="android/app/build.gradle.kts"; fi
          echo "Found file: $FILE"
          cat $FILE
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' $FILE || true
          sed -i 's/minSdkVersion 22/minSdkVersion 23/g' $FILE || true
          sed -i 's/minSdk = 21/minSdk = 23/g' $FILE || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' $FILE || true
          sed -i 's/compileSdk = 34/compileSdk = 36/g' $FILE || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' $FILE || true
          sed -i 's/targetSdk = 34/targetSdk = 36/g' $FILE || true
          if ! grep -q "ndkVersion" $FILE; then echo '    ndkVersion = "27.0.12077973"' >> $FILE; fi
          sed -i 's/ndkVersion.*/    ndkVersion = "27.0.12077973"/' $FILE || true
          cat $FILE
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RASSLIVE-BEST-APK
          path: "**/build/app/outputs/flutter-apk/*.apk"
          if-no-files-found: warn
          retention-days: 7
