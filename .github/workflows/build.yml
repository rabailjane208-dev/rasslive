name: RASS LIVE 80 GIFTS ZEGO FINAL
on:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - run: |
          flutter clean
          rm -rf android
          flutter create --platforms=android --org com.rasslive.app . --overwrite
      - run: |
          cp rass_legendary_final.dart lib/main.dart
      - run: |
          FILE="android/app/build.gradle.kts"
          [ -f "android/app/build.gradle" ] && FILE="android/app/build.gradle"
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' $FILE || true
          sed -i 's/minSdk = 21/minSdk = 23/g' $FILE || true
          sed -i 's/compileSdk = 34/compileSdk = 36/g' $FILE || true
          if ! grep -q "ndkVersion" $FILE; then sed -i '/android {/a \    ndkVersion = "27.0.12077973"' $FILE; fi
      - run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: RASSLIVE-80-GIFTS-ZEGO-FINAL
          path: "**/build/app/outputs/flutter-apk/*.apk"
