name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Recreate android platform
        run: flutter create --org com.rasslive --platforms android .
      - name: Apply AndroidManifest permissions
        run: cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Patch Kotlin version
        run: |
          sed -i 's/id "kotlin-android"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/app/build.gradle
          echo "=== plugins ==="
          sed -n '1,6p' android/app/build.gradle
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK to gofile
        run: |
          RESP=$(curl -s -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://upload.gofile.io/uploadFile)
          echo "GOFILE_RESPONSE=$RESP"
      - uses: actions/upload-artifact@v4
        with:
          name: RASSLIVE-APK-FINAL-000
          path: build/app/outputs/flutter-apk/app-release.apk