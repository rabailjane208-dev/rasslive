name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Recreate android platform
        run: flutter create --org com.rasslive --platforms android .
      - name: Apply AndroidManifest permissions
        run: cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: RASSLIVE-APK-FINAL-000
          path: build/app/outputs/flutter-apk/app-release.apk
EOF