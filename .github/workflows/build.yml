name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --project-name rasslive --org com.rasslive.app
          sed -i 's/compileSdk .*/compileSdk 35/' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 35/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 23/' android/app/build.gradle || true
          cat android/app/build.gradle
          flutter pub get
          flutter build apk --release --no-tree-shake-icons -v
      - uses: actions/upload-artifact@v4
        with:
          name: RASS-LIVE-CAMERA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
