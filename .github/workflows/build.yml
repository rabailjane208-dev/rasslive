name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
      - name: Recreate android platform
        run: flutter create . --org com.rasslive --project-name rasslive_world --platforms=android
      - name: Patch SDK 36
        run: |
          sed -i 's/compileSdk 33/compileSdk 36/g; s/compileSdkVersion 33/compileSdkVersion 36/g; s/targetSdk 33/targetSdk 36/g; s/compileSdk 34/compileSdk 36/g; s/compileSdk 35/compileSdk 36/g' android/app/build.gradle
          grep -n compileSdk android/app/build.gradle
      - name: Apply AndroidManifest permissions
        run: cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Remove test dir
        run: rm -rf test
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK to gofile
        run: |
          RESP=$(curl -s -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://upload.gofile.io/uploadFile)
          echo "GOFILE_RESPONSE=$RESP"
      - uses: actions/upload-artifact@v4
        with:
          name: RASS-LIVE-FINAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
