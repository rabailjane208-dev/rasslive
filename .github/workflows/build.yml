name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      - name: Fix Android Embedding + Build APK
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name rass_live
          flutter pub get
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/' android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 23/' android/app/build.gradle || true
          flutter build apk --debug --verbose
      - name: Upload GREEN APK
        uses: actions/upload-artifact@v4
        with:
          name: RASS-LIVE-CAMERA-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
